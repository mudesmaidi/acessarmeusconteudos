<style>
*{margin:0;padding:0;box-sizing:border-box;}

body{
font-family:Arial,sans-serif;
background:linear-gradient(135deg,#1a1a1a 0%,#2d2d2d 100%);
color:white;
min-height:100vh;
padding:20px;
}

.header{
text-align:center;
padding:30px 20px;
margin-bottom:30px;
background:rgba(255,0,102,0.1);
border-radius:15px;
}

.header h1{
font-size:2.5em;
color:#ff0066;
margin-bottom:10px;
}

.video-grid{
display:grid;
grid-template-columns:repeat(auto-fill,minmax(300px,1fr));
gap:25px;
max-width:1400px;
margin:0 auto;
padding:20px;
}

.video-card{
background:rgba(255,255,255,0.05);
border-radius:15px;
overflow:hidden;
cursor:pointer;
transition:.3s;
}

.video-card:hover{
transform:translateY(-10px);
}

.video-thumbnail{
width:100%;
height:200px;
background:linear-gradient(45deg,#ff0066,#ff6699);
display:flex;
align-items:center;
justify-content:center;
font-size:3em;
position:relative;
}

.video-thumbnail::before{
content:'▶';
position:absolute;
font-size:3em;
}

.video-info{
padding:15px;
}

.modal{
display:none;
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(0,0,0,.95);
justify-content:center;
align-items:center;
z-index:1000;
}

.modal.active{
display:flex;
}

.modal video{
width:90%;
max-height:80vh;
}

.close-btn{
position:absolute;
top:20px;
right:30px;
font-size:2em;
color:white;
cursor:pointer;
z-index:1001;
}
</style>
</head>

<body>

<div class="header">
<h1>💕 Meus Vídeos Exclusivos 💕</h1>
<p>Conteúdo especial só para você!</p>
</div>

<div class="video-grid" id="videoGrid"></div>

<div class="modal" id="videoModal">
<span class="close-btn" onclick="closeModal()">×</span>
<video id="modalVideo" controls playsinline></video>
</div>

<script>

// =====================
// LINKS ORDENADOS 1–30
// =====================
const links = {

6:'https://res.cloudinary.com/dhcffmlqh/video/upload/v1773540048/video6_hpvvo7.mp4',
7:'https://res.cloudinary.com/dhcffmlqh/video/upload/v1773540055/video7_zxxknf.mp4',

30:'https://res.cloudinary.com/dhcffmlqh/video/upload/v1773540325/video30_uweuea.mp4'
};

// =====================
// CRIA GRID
// =====================
const grid=document.getElementById('videoGrid');

for(let i=1;i<=30;i++){
const card=document.createElement('div');
card.className='video-card';

card.innerHTML=`
<div class="video-thumbnail">${i}</div>
<div class="video-info">
<div>Vídeo ${i}</div>
<div>Clique para assistir</div>
</div>
`;

card.onclick=()=>openVideo(i);
grid.appendChild(card);
}

// =====================
// ABRIR VÍDEO + PIXEL
// =====================
const modal=document.getElementById('videoModal');
const video=document.getElementById('modalVideo');

function openVideo(num){

fbq('trackCustom','VideoSelecionado',{
video_numero:num
});

modal.classList.add('active');

video.pause();
video.removeAttribute('src');

video.src=links[num];
video.load();

setTimeout(()=>{
video.play().catch(()=>{});
},100);
}

// =====================
// FECHAR MODAL
// =====================
function closeModal(){
modal.classList.remove('active');
video.pause();
video.removeAttribute('src');
video.load();
}

modal.onclick=e=>{
if(e.target===modal) closeModal();
}

</script>

</body>
</html>
