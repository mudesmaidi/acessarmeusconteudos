<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Privacy - Meus Conteúdos!</title>

    <script>
      !function(f,b,e,v,n,t,s)
      {if(f.fbq)return;n=f.fbq=function(){n.callMethod?
      n.callMethod.apply(n,arguments):n.queue.push(arguments)};
      if(!f._fbq)f._fbq=n;n.push=n;n.loaded=!0;n.version='2.0';
      n.queue=[];t=b.createElement(e);t.async=!0;
      t.src=v;s=b.getElementsByTagName(e)[0];
      s.parentNode.insertBefore(t,s)}(window, document,'script',
      'https://connect.facebook.net/en_US/fbevents.js');

      fbq('init', '2502704343582855');
      fbq('track', 'PageView');
    </script>

    <noscript>
      <img height="1" width="1" style="display:none"
      src="https://www.facebook.com/tr?id=2502704343582855&ev=PageView&noscript=1"/>
    </noscript>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #141414;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .popup {
            display: flex;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.8);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }

        .popup-content {
            background-color: white;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
            color: black;
            width: 80%;
            max-width: 400px;
        }

        .popup-content h2 {
            margin: 10px 0;
            font-size: 20px;
        }

        .popup-content p {
            margin: 10px 0;
            font-size: 16px;
        }

        .popup-content button {
            background-color: #ff0066;
            color: white;
            border: none;
            border-radius: 30px;
            padding: 10px 30px;
            font-size: 18px;
            cursor: pointer;
            margin-top: 15px;
        }

        .popup-content button:hover {
            background-color: #e6005c;
        }

        .popup-content a {
            display: block;
            margin-top: 10px;
            font-size: 14px;
            text-decoration: none;
            color: #666;
        }

        .popup-content a:hover {
            color: #333;
        }
    </style>
</head>

<body>

<div class="popup">
    <div class="popup-content">

        <h2>Você tem mais de 18 anos?</h2>
        <p>Você quer ver meus conteúdos, mas antes me responda por favor</p>
        <button id="confirmButton">Sim, eu tenho</button>
        <a href="/videos.html" id="underageLink">Ainda não tenho 18 anos</a>
    </div>
</div>

<script>
// -----------------------------------------------------------------
// Purchase dispara no clique de qualquer uma das duas opções do popup,
// já que essa página só é acessada por quem já pagou (link de acesso
// pós-compra). Valor fixo de R$10 (preço real do produto).
// -----------------------------------------------------------------

function dispararComprarERedirecionar(url) {
    if (typeof fbq === 'function') {
        fbq('track', 'Purchase', {
            value: 10.00,
            currency: 'BRL',
            content_name: 'Acesso_Videos_Nomemodelo',
            content_category: 'Conteudo_Exclusivo',
            num_items: 30
        });
    }
    window.location.href = url;
}

document.getElementById('confirmButton').onclick = function() {
    dispararComprarERedirecionar('/videos.html');
};

document.getElementById('underageLink').onclick = function(e) {
    e.preventDefault();
    dispararComprarERedirecionar('/videos.html');
};
</script>

</body>
</html>
