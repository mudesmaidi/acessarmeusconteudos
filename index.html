<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Privacy - Meus Conteúdos!</title>

    <script>
      !function(f,b,e,v,n,t,s)
      {if(f.fbq)return;n=f.fbq=function(){n.callMethod?
      n.callMethod.apply(n,arguments):n.queue.push(arguments)};
      if(!f._fbq)f._fbq=n;n.push=n;n.loaded=!0;n.version='2.0';
      n.queue=[];t=b.createElement(e);t.async=!0;
      t.src=v;s=b.getElementsByTagName(e)[0];
      s.parentNode.insertBefore(t,s)}(window, document,'script',
      'https://connect.facebook.net/en_US/fbevents.js');

      fbq('init', '1367542435470120');
      fbq('track', 'PageView');
    </script>

    <noscript>
      <img height="1" width="1" style="display:none"
      src="https://www.facebook.com/tr?id=1367542435470120&ev=PageView&noscript=1"/>
    </noscript>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #141414;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .popup {
            display: flex;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.8);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }

        .popup-content {
            background-color: white;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
            color: black;
            width: 80%;
            max-width: 400px;
        }

        .popup-content h2 {
            margin: 10px 0;
            font-size: 20px;
        }

        .popup-content p {
            margin: 10px 0;
            font-size: 16px;
        }

        .popup-content button {
            background-color: #ff0066;
            color: white;
            border: none;
            border-radius: 30px;
            padding: 10px 30px;
            font-size: 18px;
            cursor: pointer;
            margin-top: 15px;
        }

        .popup-content button:hover {
            background-color: #e6005c;
        }

        .popup-content a {
            display: block;
            margin-top: 10px;
            font-size: 14px;
            text-decoration: none;
            color: #666;
        }

        .popup-content a:hover {
            color: #333;
        }
    </style>
</head>

<body>

<div class="popup">
    <div class="popup-content">

        <h2>Você tem mais de 18 anos?</h2>
        <p>Você quer ver meus conteúdos, mas antes me responda por favor</p>
        <button id="confirmButton">Sim, eu tenho</button>
        <a href="/videos.html" id="underageLink">Ainda não tenho 18 anos</a>
    </div>
</div>

<script>
// -----------------------------------------------------------------
// Purchase é disparado UMA VEZ ao carregar esta página, já que ela
// só é acessada por quem completou o pagamento (link de acesso pós-compra).
// Não fica amarrado ao botão de idade — essa é uma pergunta separada
// da liberação de conteúdo, não faz sentido controlar a compra por ela.
//
// Proteção contra duplicidade: usa localStorage para não disparar
// Purchase de novo se a pessoa atualizar ou voltar nesta página.
// Se seu funil permite reprocessar o mesmo link várias vezes para
// pessoas diferentes, troque a chave abaixo por algo único por venda
// (ex: um parâmetro `?pedido=ID_DA_VENDA` vindo do seu checkout).
// -----------------------------------------------------------------

(function () {
    var params = new URLSearchParams(window.location.search);
    var orderId = params.get('pedido') || params.get('order_id');
    var storageKey = orderId ? ('purchase_fired_' + orderId) : 'purchase_fired_default';

    var value = parseFloat(params.get('valor')) || 10.00; // valor padrão: R$10 (pode ser sobrescrito via ?valor=XX na URL)
    var currency = 'BRL';

    if (typeof fbq === 'function' && !localStorage.getItem(storageKey)) {
        fbq('track', 'Purchase', {
            value: value,
            currency: currency,
            content_name: 'Acesso_Videos_Nomemodelo',
            content_category: 'Conteudo_Exclusivo',
            num_items: 30
        });
        localStorage.setItem(storageKey, '1');
    }
})();

document.getElementById('confirmButton').onclick = function() {
    window.location.href = '/videos.html';
};

document.getElementById('underageLink').onclick = function(e) {
    e.preventDefault();
    window.location.href = '/videos.html';
};
</script>

</body>
</html>
